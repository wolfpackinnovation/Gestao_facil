# ========== SUPPLIERS ==========
query ListSuppliers($companyId: String!) {
  suppliers @where(companyId: $companyId) @orderBy(name: ASC)
}

# ========== CATEGORIES ==========
query ListCategories($companyId: String!) {
  categories @where(companyId: $companyId) @orderBy(name: ASC)
}

# ========== CASH REGISTERS ==========
query ListCashRegisters($companyId: String!) {
  cashRegisters @where(companyId: $companyId)
}

mutation CreateCashMovement(
  $cashRegisterId: String!,
  $userId: String!,
  $type: String!,
  $amount: Float!,
  $balanceAfter: Float,
  $description: String
) {
  cashMovement_insert(data: {
    cashRegisterId: $cashRegisterId,
    userId: $userId,
    type: $type,
    amount: $amount,
    balanceAfter: $balanceAfter,
    description: $description
  })
}

# ========== RECEIVABLES / PAYABLES ==========
query ListReceivables($companyId: String!) {
  receivables @where(companyId: $companyId) @orderBy(dueDate: ASC)
}

query ListPayables($companyId: String!) {
  payables @where(companyId: $companyId) @orderBy(dueDate: ASC)
}

# ========== ORDERS (TABLE MODULE) ==========
query ListOrders($companyId: String!) {
  orders @where(companyId: $companyId) @orderBy(createdAt: DESC)
}

# ========== PRODUCTIONS ==========
query ListProductions($companyId: String!) {
  productions @where(companyId: $companyId)
}
