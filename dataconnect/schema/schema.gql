scalar Date

type Company
  @table {
  id: UUID! @default(expr: "gen_random_uuid()")
  name: String!
  cnpj: String! @unique
  email: String
  phone: String
  logoUrl: String
  active: Boolean! @default(value: true)
  settings: String
  subscriptionStatus: String
  createdAt: Date! @default(expr: "now()")
  updatedAt: Date! @default(expr: "now()")
}

type User
  @table {
  id: UUID! @default(expr: "gen_random_uuid()")
  companyId: String!
  name: String!
  email: String! @unique
  role: String!
  phone: String
  createdAt: Date! @default(expr: "now()")
  updatedAt: Date! @default(expr: "now()")
}

